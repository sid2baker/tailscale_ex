name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      network_tests:
        description: Contact the Tailscale control plane for URL and invalid-key tests
        type: boolean
        default: false

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  unit:
    name: Unit tests and quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Install build tools and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Run CI checks
        run: mix ci

      - name: Build documentation and Hex package
        env:
          MIX_ENV: dev
        run: |
          mix docs --warnings-as-errors
          mix hex.build

  daemon:
    name: Isolated Tailscale 1.102.3 userspace integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Install build tools and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Fetch pinned daemon and verify archive
        run: |
          curl --fail --location --retry 3 \
            https://pkgs.tailscale.com/stable/tailscale_1.102.3_amd64.tgz \
            --output "$RUNNER_TEMP/tailscale.tgz"
          echo "36ddd9b51be57ffc2990cf76323cfa13643bfbb1b8a969f6183fa164741cdef5  $RUNNER_TEMP/tailscale.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tailscale.tgz" -C "$RUNNER_TEMP"
          echo "TAILSCALED_TEST_BINARY=$RUNNER_TEMP/tailscale_1.102.3_amd64/tailscaled" >> "$GITHUB_ENV"

      - name: Run real-daemon tests (never attach to a host daemon)
        env:
          TAILSCALE_TEST_NETWORK: ${{ inputs.network_tests && '1' || '0' }}
        run: mix test test/integration/daemon_test.exs
